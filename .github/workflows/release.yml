name: Release

# Builds and publishes a GitHub release when a version tag (v*) is pushed,
# using GoReleaser (see .goreleaser.yaml):
#
#   darwin/amd64 + darwin/arm64 with CGO (CoreBluetooth; the amd64 binary is
#   cross compiled from the arm64 runner with Apple clang)
#   linux/amd64, linux/arm64, linux/arm (v7, what a Cerbo GX runs) with
#   CGO disabled - statically linked
#
# Assets: tar.gz (linux) / zip (macOS) plus SHA256SUMS.txt, attached to a
# GitHub release with generated notes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

  release:
    name: goreleaser
    needs: test
    # macOS runner: the darwin builds need cgo (CoreBluetooth); the linux
    # targets cross compile from here with CGO disabled.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # GoReleaser wants the full history and tags for changelogs.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: check

      - name: Build and publish the release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
